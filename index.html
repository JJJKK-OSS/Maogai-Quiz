ge83","type":"judge","n":83,"q":"新中国成⽴初期，我国主要是学习苏联经验，这在当时是必要的，也取得了 ⼀定的成效，这证明，照搬照抄苏联模式符合中国国情。","options":["正确","错误"],"answer":"B"},{"id":"judge84","type":"judge","n":84,"q":"我国社会主义改造的任务完成以后，国内的社会⽭盾和阶级关系发⽣ ⼤的 变化，⽆产阶级同资产阶级之间的⽭盾已经完全彻底地解决了。","options":["正确","错误"],"answer":"B"},{"id":"judge85","type":"judge","n":85,"q":"关于社会主义社会的⽭盾问题，⻢克思、恩格斯和列宁进⾏过专⻔的论述。","options":["正确","错误"],"answer":"B"},{"id":"judge86","type":"judge","n":86,"q":"斯⼤林在领导苏联社会主义建设的实践中，⻓期不承认社会主义存在⽭盾， 在实践中造成了严 后果。","options":["正确","错误"],"answer":"A"},{"id":"judge87","type":"judge","n":87,"q":"波匈事件对我国的影响，是⽑泽东提出正确处理⼈⺠内部⽭盾的 要背景。","options":["正确","错误"],"answer":"A"},{"id":"judge88","type":"judge","n":88,"q":"社会主义社会的⽭盾反映在政治上可以划分为敌我⽭盾和⼈⺠内部⽭盾，这 是两类性质相同的⽭盾。","options":["正确","错误"],"answer":"B"},{"id":"judge89","type":"judge","n":89,"q":"在我国社会主义建设初期，⼯⼈阶级同⺠族资产阶级的⽭盾属于敌我⽭盾。","options":["正确","错误"],"answer":"B"},{"id":"judge90","type":"judge","n":90,"q":"在《关于正确处理⼈⺠内部⽭盾的问题》⼀⽂中，⽑泽东明确提出要求⼀条 有别于苏联的中国⼯业化道路。","options":["正确","错误"],"answer":"A"},{"id":"judge91","type":"judge","n":91,"q":"社会主义道路初步探索的成就表明，社会主义建设没有⼀个固定不变的模 式，各个国家应该根据⾃⼰的国情，独⽴⾃主地选择适合⾃⼰的发展道路。","options":["正确","错误"],"answer":"A"},{"id":"judge92","type":"judge","n":92,"q":"社会主义代替资本主义，并不意味着社会主义要全盘否定和抛弃资本主义创 造的⼀切成果，也并不意味着社会主义不同资本主义发⽣任何联系。","options":["正确","错误"],"answer":"A"},{"id":"judge93","type":"judge","n":93,"q":"实践证明，⽆产阶级政党在执政以后，必须认真坚持⺠主集中制和集体领导 原则，反对个⼈崇拜，不断加强党的⾃身建设，充分发挥党组织和⼴⼤党员的 积极性、创造性，保证党的决策的科学化、⺠主化。","options":["正确","错误"],"answer":"A"},{"id":"judge94","type":"judge","n":94,"q":"《关于正确处理⼈⺠内部⽭盾的问题》的报告，初步总结了我国社会主义建 设的经验，明确提出了以苏为鉴，独⽴⾃主地探索适合中国情况的社会主义建 设道路","options":["正确","错误"],"answer":"B"},{"id":"judge95","type":"judge","n":95,"q":"社会主义制度建⽴后，⼯⼈阶级和⺠族资产阶级仍然存在着对抗性的⽭盾。","options":["正确","错误"],"answer":"B"},{"id":"judge96","type":"judge","n":96,"q":"20世纪50-60年代，邓⼩平提出了要建⽴“适合于我国情况和⼈⺠需要的社会 主义的市场”的思想。","options":["正确","错误"],"answer":"B"},{"id":"judge97","type":"judge","n":97,"q":"⽑泽东提出以⼯业为主导，把 ⼯业作为我国经济建设的 点，以逐步建⽴ 独⽴的⽐较完整的基础⼯业体系和国防⼯业体系。","options":["正确","错误"],"answer":"A"},{"id":"judge98","type":"judge","n":98,"q":"全⾯建设社会主义时期⽑泽东和党的其他领导⼈提出的关于社会主义建设的 ⼀系列正确观点，是中国特⾊社会主义理论体系的 要内容。","options":["正确","错误"],"answer":"B"},{"id":"judge99","type":"judge","n":99,"q":"社会主义社会中已经消除了⽭盾。","options":["正确","错误"],"answer":"B"},{"id":"judge100","type":"judge","n":100,"q":"社会主义社会基本⽭盾的特点是⼜相适应⼜相⽭盾。","options":["正确","错误"],"answer":"A"},{"id":"judge101","type":"judge","n":101,"q":"1982年邓⼩平在党的⼗⼆⼤开幕词中明确提出:⾛⾃⼰的路,建设有中国特⾊ 的社会主义。","options":["正确","错误"],"answer":"A"},{"id":"judge102","type":"judge","n":102,"q":"改⾰开放和社会主义现代化建设新时期，党⾯临的主要任务是,继续探索中 国建设社会主义的正确道路，解放和发展社会⽣产⼒,使⼈⺠摆脱贫困、尽快富 裕起来，为实现中华⺠族伟⼤复兴提供充满新的活⼒的体制保证和快速发展的 物质条件。","options":["正确","错误"],"answer":"A"},{"id":"judge103","type":"judge","n":103,"q":"⽑泽东思想是中国特⾊社会主义理论体系 要组成部分。","options":["正确","错误"],"answer":"B"},{"id":"judge104","type":"judge","n":104,"q":"江泽⺠在2001年7⽉1⽇庆祝中国共产党成⽴⼋⼗周年⼤会上全⾯阐述三个 代表 要思想的科学内涵和基本内容。","options":["正确","错误"],"answer":"A"},{"id":"judge105","type":"judge","n":105,"q":"邓⼩平明确提出了科学技术已经成为先进⽣产⼒的集中体现和主要标志、 社会主义仍然代表⼈类未来发展⽅向等 ⼤论断。","options":["正确","错误"],"answer":"B"},{"id":"judge106","type":"judge","n":106,"q":"1987年党的⼗三⼤，第⼀次⽐较系统地论述了我国社会主义初级阶段理 论。","options":["正确","错误"],"answer":"A"},{"id":"judge107","type":"judge","n":107,"q":"科学发展观所要解决的根本问题是“建设⼀个什么样的党、怎样建设党”。","options":["正确","错误"],"answer":"B"},{"id":"judge108","type":"judge","n":108,"q":"1992年，邓⼩平在南⽅谈话提出了社会主义的本质是解放⽣产⼒，发展⽣ 产⼒，消灭剥削，消除两极分化，最终达到共同富裕的 要论断。","options":["正确","错误"],"answer":"A"},{"id":"judge109","type":"judge","n":109,"q":"“⼀个中⼼、两个基本点”的基本路线是在1987年党的⼗三⼤得到明确概论 和全⾯阐发。","options":["正确","错误"],"answer":"A"},{"id":"judge110","type":"judge","n":110,"q":"党的⼗⼋⼤以来，党⾯临的主要任务是，实现第⼀个百年奋⽃⽬标，开启 实现第⼆个百年奋⽃⽬标新征程，朝着实现中华⺠族伟⼤复兴的宏伟⽬标继续 前进。","options":["正确","错误"],"answer":"A"},{"id":"judge111","type":"judge","n":111,"q":"邓⼩平发表了《解放思想，实事求是，团结⼀致向前看》的 要讲话，这 实际上是党的⼗⼀届三中全会的主题报告。","options":["正确","错误"],"answer":"A"},{"id":"judge112","type":"judge","n":112,"q":"“⾃⼒更⽣，艰苦创业”不仅是改变我国不发达现状的需要，也体现了社会 主义的奋⽃精神","options":["正确","错误"],"answer":"A"},{"id":"judge113","type":"judge","n":113, =[];function switchEdition(v){edition=v;QUESTIONS=v==='2024'?NEW_QUESTIONS:OLD_QUESTIONS;KEY=v==='2024'?'maogai_progress_2024_v1':'maogai_progress_v1';try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}};stats();start('order')}const $=x=>document.getElementById(x);const byId=id=>QUESTIONS.find(x=>x.id===id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));stats()};const letters=['A','B','C','D'];function stats(){let v=Object.values(db),attempts=v.reduce((a,x)=>a+x.attempts,0),correct=v.reduce((a,x)=>a+x.correct,0);$('stats').innerHTML=`<div><b>${v.length}</b><small>已练习题数</small></div><div><b>${v.filter(x=>x.wrong>0).length}</b><small>历史错题</small></div><div><b>${attempts?Math.round(correct/attempts*100):0}%</b><small>作答正确率</small></div>`}function randomize(a){return a.sort(()=>Math.random()-.5)}function start(m){mode=m;let ids=QUESTIONS.map(x=>x.id);if(m==='wrong')ids=ids.filter(id=>db[id]?.wrong>0);if(m==='random'||m==='exam')ids=randomize(ids);if(m==='exam')ids=ids.slice(0,50);queue=ids;pos=0;examResults=[];render()}function render(){const root=$('main');if(!queue.length){root.innerHTML='<h2>暂无题目</h2><p>如果你选择了只刷错题，先去顺序刷题积累错题吧。</p>';return}if(pos>=queue.length){root.innerHTML=`<h2>🎉 本轮完成</h2><p>${mode==='exam'?'模拟考试：'+examResults.filter(Boolean).length+' / '+examResults.length+' 题正确':'本轮题目已完成'}</p><button class="primary" onclick="start('${mode}')">再来一轮</button>`;return}let q=byId(queue[pos]);selected=[];done=false;let h=db[q.id]||{attempts:0,wrong:0,correct:0,mastered:false};root.innerHTML=`<div class="row"><span class="tag">${q.type==='single'?'单选':q.type==='multi'?'多选':'判断'} · 原题 ${q.n}</span><span class="tag">${pos+1} / ${queue.length}</span></div><div class="question">${esc(q.q)}</div><div id="options"></div><div id="notice"></div><div class="row" style="margin-top:16px"><button onclick="prev()">上一题</button><span class="muted">累计做错 <strong style="color:#c43e4b;font-size:17px">${h.wrong}</strong> 次 ${h.mastered?'· 已掌握':''}</span><button e" accept="application/json" hidden onchange="importData(event)"></div><div id="wronglist"></div>`;filterWrong()}function filterWrong(){let v=$('filter').value,arr=QUESTIONS.filter(q=>db[q.id]?.wrong>0&&(v==='all'||(v==='mastered'?db[q.id].mastered:!db[q.id].mastered))).sort((a,b)=>db[b.id].wrong-db[a.id].wrong);$('wronglist').innerHTML=arr.length?arr.map(q=>`<div class="history"><b>${q.type==='single'?'单选':q.type==='multi'?'多选':'判断'} ${q.n}.</b> ${esc(q.q)}<div class="muted"><strong style="color:#c43e4b">累计做错 ${db[q.id].wrong} 次</strong> · ${db[q.id].mastered?'已掌握':'尚未掌握'}</div><button onclick="review('${q.id}')">重新做这题</button></div>`).join(''):'<p class="muted">当前筛选下没有错题。</p>'}function review(id){mode='wrong';queue=[id];pos=0;render()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='毛概刷题记录_'+edition+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let o=JSON.parse(t);if(!o||typeof o!=='object'||Array.isArray(o))throw Error();db=o;save();showWrong()}catch(e){alert('文件格式不正确')}})}stats();start('order');</script><script id="night-theme-js">(function(){var key='maogai_theme';var dark=false;try{dark=localStorage.getItem(key)==='night'}catch(e){}function setTheme(v){dark=v;document.body.classList.toggle('night',dark);document.documentElement.style.colorScheme=dark?'dark':'light';var b=document.getElementById('night-toggle');if(b){b.textContent=dark?'☀️ 日间模式':'🌙 深夜模式';b.setAttribute('aria-pressed',String(dark))}try{localStorage.setItem(key,dark?'night':'day')}catch(e){}}var b=document.getElementById('night-toggle');if(b)b.addEventListener('click',function(){setTheme(!dark)});setTheme(dark)})();</script></html>
