，以习近平同志为核⼼的党中央明确提出要不断推进⻢克思 主义中国化时代化。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge7", "type": "judge", "n": 7, "q": "2021年，党的⼗九届六中全会通过的《中共中央关于党的百年奋⽃ ⼤成就 和历史经验的决议》总结了百年来中国共产党推进⻢克思主义中国化时代化的 ⼤成就，阐释了⻢克思主义中国化时代化的 ⼤历史意义。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge8", "type": "judge", "n": 8, "q": "党的⼆⼗⼤明确把“不断谱写⻢克思主义中国化时代化新篇章”作为当代中国 共产党⼈的庄严历史责任，并提出了继续推进⻢克思主义中国化时代化的新要 求。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge9", "type": "judge", "n": 9, "q": "中国共产党⾃成⽴以来，始终坚持把⻢克思主义基本原理同中国具体实际和 时代特征相结合，不断进⾏理论创新。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge10", "type": "judge", "n": 10, "q": "推进⻢克思主义中国化时代化，是⻢克思主义理论本身发展的内在要求。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge11", "type": "judge", "n": 11, "q": "推进⻢克思主义中国化时代化，是解决中国实际冋题的客观需要。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge12", "type": "judge", "n": 12, "q": "中国共产党的历史，是⼀部不断推进⻢克思主义中国化时代化的历史，是⼀ 部不断推进理论创新、进⾏理论创造的历史。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge13", "type": "judge", "n": 13, "q": "在社会主义建设时期，以⽑泽东同志为主要代表的中国共产党⼈，把⻢克思 列宁主义基本原理同中国具体实际结合起来，开辟了农村包围城市、武装夺取 政权的正确⾰命道路，创⽴了⽑泽东思想。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge14", "type": "judge", "n": 14, "q": "在新⺠主主义⾰命时期，以⽑泽东同志为主要代表的中国共产党⼈，提出把 ⻢克思列宁主义基本原理同中国具体实际进⾏“第⼆次结合”，结合新的实际丰 富和发展了⽑泽东思想。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge15", "type": "judge", "n": 15, "q": "⽑泽东思想是⻢克思主义中国化时代化的第⼀次历史性⻜跃。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge16", "type": "judge", "n": 16, "q": "邓⼩平理论，是中国特⾊社会主义理论体系的开篇之作。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge17", "type": "judge", "n": 17, "q": "党的⼗⼀届三中全会以后，以江泽⺠同志为主要代表的中国共产党⼈形成的 “三个代表” 要思想，推动了中国特⾊社会主义理论体系的跨世纪发展；", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge18", "type": "judge", "n": 18, "q": "党的⼗六⼤以后，以胡锦涛同志为主要代表的中国共产党⼈形成的科学发展 观，深刻认识和回答了什么是社会主义、怎样建设社会主义，形成了科学发展 观。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge19", "type": "judge", "n": 19, "q": "党的⼗七⼤提出了“中国特⾊社会主义理论体系”的科学概念。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge20", "type": "judge", "n": 20, "q": "党的⼗⼋⼤以来，以习近平同志为主要代表的中国共产党⼈创⽴了习近平新 时代中国特⾊社会主义思想，谱写了新时代中国特⾊社会主义新篇章。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge21", "type": "judge", "n": 21, "q": "⽑泽东思想为中华⺠族伟⼤复兴根本社会条件的创造、根本政治前提和制度 基础的奠定提供了科学指南。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge22", "type": "judge", "n": 22, "q": "⽑泽东思想是在我国旧⺠主主义⾰命的实践过程中，逐步形成和发展起来 的。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge23", "type": "judge", "n": 23, "q": "从进攻⼤城市转为向农村进军，是中国⾰命具有决定意义的新起点。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge24", "type": "judge", "n": 24, "q": "遵义会议以后，⽑泽东提出，正是由于“经过胜利、失败，再胜利、再失败 两次⽐较，我们才认识了中国这个客观世界。”", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge25", "type": "judge", "n": 25, "q": "⽑泽东从中国的历史和现实出发，创⽴了⽆产阶级领导的、，⼯农联盟为基 础的，⼈⺠⼤众的，反对帝国主义、封建主义和城市⼩资产阶级的新⺠主主义 ⾰命理论。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge26", "type": "judge", "n": 26, "q": "⽑泽东思想是中国特⾊社会主义理论体系的开篇之作。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge27", "type": "judge", "n": 27, "q": "⽑泽东对新⺠主主义⾰命理论的系统阐述，标志着⽑泽东思想初步形成。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge28", "type": "judge", "n": 28, "q": "注 思想建党、理论强党，是我们党的鲜明特⾊和光荣传统。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge29", "type": "judge", "n": 29, "q": "⽑泽东思想就是⽑泽东的思想，所以，⽑泽东的科学著作是⽑泽东思想的集 中概括。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge30", "type": "judge", "n": 30, "q": "在新⺠主主义⾰命⾰命时期，⽑泽东提出把⻢克思主义基本原理同中国具体 实际进⾏“第⼆次结合”。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge31", "type": "judge", "n": 31, "q": "⽑泽东认为，社会主义社会已经不存在⽭盾了。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge32", "type": "judge", "n": 32, "q": "⽑泽东指出，党员不但要在组织上⼊党，⽽且要在思想上⼊党，经常注意以 ⽆产阶级思想改造和克服各种⾮⽆产阶级思想。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge33", "type": "judge", "n": 33, "q": "坚持实事求是，就要深⼊实际了解事物的本来⾯貌，把握事物内在必然联 系，按照客观规律办事。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge34", "type": "judge", "n": 34, "q": "群众路线本质上体现的是⻢克思主义关于⼈⺠群众是历史的创造者这⼀基本 原理。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge35", "type": "judge", "n": 35, "q": "独⽴⾃主，坚持独⽴思考，⾛⾃⼰的路，就是坚定不移地维护⺠族独⽴、捍 卫国家主权，把⽴⾜点放在依靠⾃⼰⼒ 的基础上，同时积极争取外援。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge36", "type": "judge", "n": 36, "q": "历史反复证明，⼈⺠群众是历史发展和社会进步的主体⼒ 。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge37", "type": "judge", "n": 37, "q": "⽑泽东思想紧紧围绕中国⾰命和建设的主题，提出了⼀系列相互关联的 要 理论观点，构成了⼀个完整的科学思想体系。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge38", "type": "judge", "n": 38, "q": "⽑泽东提出的把对⼈⺠内部的⺠主和对敌⼈的专政互相结合起来就是⼈⺠⺠ 主专政的理论，丰富了⻢克思列宁主义关于⽆产阶级专政的学说。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge39", "type": "judge", "n": 39, "q": "我们⼀切路线、⽅针、政策的制定都应坚持从我国基本国情出发，牢牢⽴⾜ 基本国情这个最⼤实际。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge40", "type": "judge", "n": 40, "q": "坚持独⽴⾃主，只需要坚定不移维护⺠族独⽴、捍卫国家主权，以武⼒的⽅ 式解决国际争端。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge41", "type": "judge", "n": 41, "q": "中国新⺠主主义的⾰命任务是反对帝国主义、封建主义和⺠族资本主义。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge42", "type": "judge", "n": 42, "q": "解决中国⾰命问题的基本前提是建⽴统⼀战线", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge43", "type": "judge", "n": 43, "q": "鸦⽚战争后中国逐步沦为半殖⺠地半封建社会", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge44", "type": "judge", "n": 44, "q": "近代中国的社会性质和主要⽭盾决定了中国⾰命仍然是资产阶级⺠主⾰命。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge45", "type": "judge", "n": 45, "q": "抗⽇战争时期，阶级⽭盾上升为主要⽭盾。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge46", "type": "judge", "n": 46, "q": "新⺠主主义⾰命的⾸要问题是分清敌友。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge47", "type": "judge", "n": 47, "q": "新⺠主主义⾰命动⼒包括⽆产阶级、农⺠阶级、城市⼩资产阶级和⺠族资产 阶级。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge48", "type": "judge", "n": 48, "q": "新⺠主主义⾰命与社会主义⾰命的性质不同。新⺠主主义⾰命仍然属于资产 阶级⺠主主义⾰命的范畴。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge49", "type": "judge", "n": 49, "q": "新⺠主主义⾰命的动⼒包括⽆产阶级、农⺠阶级、官僚资产阶级。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge50", "type": "judge", "n": 50, "q": "⽆产阶级及其政党对中国的领导权是⾃然⽽然得来的。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge51", "type": "judge", "n": 51, "q": "中国共产党领导⼈⺠开展新⺠主主义⾰命，是要建⽴⼀个新⺠主主义政权。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge52", "type": "judge", "n": 52, "q": "没收封建地主阶级的⼟地归农⺠所有，是新⺠主主义⾰命的主要内容。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge53", "type": "judge", "n": 53, "q": "没收官僚资本归新⺠主主义国家所有，是新⺠主主义⾰命的题中应有之义。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge54", "type": "judge", "n": 54, "q": "⽑泽东在《在晋绥⼲部会议上的讲话》⼀⽂中⾸次提出“新⺠主主义⾰命”的 科学概念。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge55", "type": "judge", "n": 55, "q": "党成⽴初期，⾸先把⼯作 ⼼放在乡村。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge56", "type": "judge", "n": 56, "q": "中国⾰命必须⾛农村包围城市、武装夺取政权的道路，都是由中国所处的时 代特点和特殊国情决定的。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge57", "type": "judge", "n": 57, "q": "党在中国⾰命中战胜敌⼈的三个主要的法宝是统⼀战线、武装⽃争、党的领 导", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge58", "type": "judge", "n": 58, "q": "建设新型⼈⺠军队的根本原则是坚持党对军队的绝对领导权。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge59", "type": "judge", "n": 59, "q": "加强党的⾃身建设，必须把思想建设始终放在党的建设的⾸位。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge60", "type": "judge", "n": 60, "q": "中国新⺠主主义⾰命的伟⼤胜利极⼤改变了世界政治格局，⿎舞了被压迫⺠ 族和被压迫⼈⺠争取解放⽃争。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge61", "type": "judge", "n": 61, "q": "在农业社会主义改造的第⼀阶段主要是发展互助组，没有试办初级社。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge62", "type": "judge", "n": 62, "q": "初级农业⽣产合作社具有完全社会主义性质。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge63", "type": "judge", "n": 63, "q": "所谓赎买，就是国家有偿地将私营企业改变为国营企业，将资本主义私有制 改变为社会主义公有制。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge64", "type": "judge", "n": 64, "q": "⼿⼯业⽣产合作社中⼿⼯业者的⽣产资料归集体所有，⼊社⼈员参加集体劳 动，实⾏按劳分配。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge65", "type": "judge", "n": 65, "q": "我国的社会主义改造全⾯推开和社会主义⼯业化全⾯展开不是同时进⾏的。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge66", "type": "judge", "n": 66, "q": "对于⼯⼈阶级和社会主义⾰命来说，⺠族资产阶级作为⼀个剥削阶级，是被 消灭的对象。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge67", "type": "judge", "n": 67, "q": "社会主义基本制度的确⽴不是为了推进中国的⼯业化、现代化建设。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge68", "type": "judge", "n": 68, "q": "社会主义基本制度的确⽴是中国历史上最深刻最伟⼤的社会变⾰。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge69", "type": "judge", "n": 69, "q": "我国社会主义基本制度的确⽴，促进社会⽣产⼒的发展，初步显示了社会主 义的优越性。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge70", "type": "judge", "n": 70, "q": "新⺠主主义社会是属于社会主义体系的，是逐步过渡到社会主义社会的过渡 性质的社会", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge71", "type": "judge", "n": 71, "q": "社会主义基本制度的确⽴，使⼴⼤劳动⼈⺠真正成为国家的主⼈。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge72", "type": "judge", "n": 72, "q": "全⾏业公私合营后，企业的⽣产关系已经发⽣了根本的变化，基本上成为社 会主义国营性质的企业。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge73", "type": "judge", "n": 73, "q": "从1949年⾄1953年，党领导⼈⺠集中⼒ 恢复国⺠经济，继续完成⺠主⾰命 遗留的任务。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge74", "type": "judge", "n": 74, "q": "1952年9⽉，⽑泽东在中央政治局会议上正式提出过渡时期的总路线和总任 务。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge75", "type": "judge", "n": 75, "q": "“⼀化三改”中“⼀化”是两翼，“三改”是主体。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge76", "type": "judge", "n": 76, "q": "要从根本上改变中国贫穷落后的⾯貌，把中国从⼀个落后的农业国变为⼀个 先进的⼯业国，就必须实现国家的⼯业化。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge77", "type": "judge", "n": 77, "q": "我国对农业、⼿⼯业和资本主义⼯商业的改造，都采取了区别对象、积极引 导、逐步过渡的⽅式。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge78", "type": "judge", "n": 78, "q": "我国采⽤和平赎买的⽅法改造资本主义⼯商业。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge79", "type": "judge", "n": 79, "q": "赎买的具体⽅式是由国家直接⽀付⼀笔巨额补偿⾦给企业资本家。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge80", "type": "judge", "n": 80, "q": "中华⼈⺠共和国成⽴以后，我国就进⼊社会主义社会。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge81", "type": "judge", "n": 81, "q": "社会主义建设道路初步探索时期，⽑泽东提出了发展商品⽣产、利⽤价值规 律的思想，认为商品⽣产在社会主义条件下，还是⼀个不可缺少的、有利的⼯ 具，要有计划地⼤⼤地发展社会主义的商品⽣产。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge82", "type": "judge", "n": 82, "q": "在社会主义社会建成以前，⽆产阶级与资产阶级的⽭盾，社会主义道路与资 本主义道路的⽭盾，始终是我国社会的主要⽭盾。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge83", "type": "judge", "n": 83, "q": "新中国成⽴初期，我国主要是学习苏联经验，这在当时是必要的，也取得了 ⼀定的成效，这证明，照搬照抄苏联模式符合中国国情。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge84", "type": "judge", "n": 84, "q": "我国社会主义改造的任务完成以后，国内的社会⽭盾和阶级关系发⽣ ⼤的 变化，⽆产阶级同资产阶级之间的⽭盾已经完全彻底地解决了。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge85", "type": "judge", "n": 85, "q": "关于社会主义社会的⽭盾问题，⻢克思、恩格斯和列宁进⾏过专⻔的论述。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge86", "type": "judge", "n": 86, "q": "斯⼤林在领导苏联社会主义建设的实践中，⻓期不承认社会主义存在⽭盾， 在实践中造成了严 后果。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge87", "type": "judge", "n": 87, "q": "波匈事件对我国的影响，是⽑泽东提出正确处理⼈⺠内部⽭盾的 要背景。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge88", "type": "judge", "n": 88, "q": "社会主义社会的⽭盾反映在政治上可以划分为敌我⽭盾和⼈⺠内部⽭盾，这 是两类性质相同的⽭盾。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge89", "type": "judge", "n": 89, "q": "在我国社会主义建设初期，⼯⼈阶级同⺠族资产阶级的⽭盾属于敌我⽭盾。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge90", "type": "judge", "n": 90, "q": "在《关于正确处理⼈⺠内部⽭盾的问题》⼀⽂中，⽑泽东明确提出要求⼀条 有别于苏联的中国⼯业化道路。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge91", "type": "judge", "n": 91, "q": "社会主义道路初步探索的成就表明，社会主义建设没有⼀个固定不变的模 式，各个国家应该根据⾃⼰的国情，独⽴⾃主地选择适合⾃⼰的发展道路。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge92", "type": "judge", "n": 92, "q": "社会主义代替资本主义，并不意味着社会主义要全盘否定和抛弃资本主义创 造的⼀切成果，也并不意味着社会主义不同资本主义发⽣任何联系。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge93", "type": "judge", "n": 93, "q": "实践证明，⽆产阶级政党在执政以后，必须认真坚持⺠主集中制和集体领导 原则，反对个⼈崇拜，不断加强党的⾃身建设，充分发挥党组织和⼴⼤党员的 积极性、创造性，保证党的决策的科学化、⺠主化。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge94", "type": "judge", "n": 94, "q": "《关于正确处理⼈⺠内部⽭盾的问题》的报告，初步总结了我国社会主义建 设的经验，明确提出了以苏为鉴，独⽴⾃主地探索适合中国情况的社会主义建 设道路", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge95", "type": "judge", "n": 95, "q": "社会主义制度建⽴后，⼯⼈阶级和⺠族资产阶级仍然存在着对抗性的⽭盾。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge96", "type": "judge", "n": 96, "q": "20世纪50-60年代，邓⼩平提出了要建⽴“适合于我国情况和⼈⺠需要的社会 主义的市场”的思想。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge97", "type": "judge", "n": 97, "q": "⽑泽东提出以⼯业为主导，把 ⼯业作为我国经济建设的 点，以逐步建⽴ 独⽴的⽐较完整的基础⼯业体系和国防⼯业体系。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge98", "type": "judge", "n": 98, "q": "全⾯建设社会主义时期⽑泽东和党的其他领导⼈提出的关于社会主义建设的 ⼀系列正确观点，是中国特⾊社会主义理论体系的 要内容。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge99", "type": "judge", "n": 99, "q": "社会主义社会中已经消除了⽭盾。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge100", "type": "judge", "n": 100, "q": "社会主义社会基本⽭盾的特点是⼜相适应⼜相⽭盾。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge101", "type": "judge", "n": 101, "q": "1982年邓⼩平在党的⼗⼆⼤开幕词中明确提出:⾛⾃⼰的路,建设有中国特⾊ 的社会主义。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge102", "type": "judge", "n": 102, "q": "改⾰开放和社会主义现代化建设新时期，党⾯临的主要任务是,继续探索中 国建设社会主义的正确道路，解放和发展社会⽣产⼒,使⼈⺠摆脱贫困、尽快富 裕起来，为实现中华⺠族伟⼤复兴提供充满新的活⼒的体制保证和快速发展的 物质条件。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge103", "type": "judge", "n": 103, "q": "⽑泽东思想是中国特⾊社会主义理论体系 要组成部分。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge104", "type": "judge", "n": 104, "q": "江泽⺠在2001年7⽉1⽇庆祝中国共产党成⽴⼋⼗周年⼤会上全⾯阐述三个 代表 要思想的科学内涵和基本内容。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge105", "type": "judge", "n": 105, "q": "邓⼩平明确提出了科学技术已经成为先进⽣产⼒的集中体现和主要标志、 社会主义仍然代表⼈类未来发展⽅向等 ⼤论断。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge106", "type": "judge", "n": 106, "q": "1987年党的⼗三⼤，第⼀次⽐较系统地论述了我国社会主义初级阶段理 论。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge107", "type": "judge", "n": 107, "q": "科学发展观所要解决的根本问题是“建设⼀个什么样的党、怎样建设党”。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge108", "type": "judge", "n": 108, "q": "1992年，邓⼩平在南⽅谈话提出了社会主义的本质是解放⽣产⼒，发展⽣ 产⼒，消灭剥削，消除两极分化，最终达到共同富裕的 要论断。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge109", "type": "judge", "n": 109, "q": "“⼀个中⼼、两个基本点”的基本路线是在1987年党的⼗三⼤得到明确概论 和全⾯阐发。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge110", "type": "judge", "n": 110, "q": "党的⼗⼋⼤以来，党⾯临的主要任务是，实现第⼀个百年奋⽃⽬标，开启 实现第⼆个百年奋⽃⽬标新征程，朝着实现中华⺠族伟⼤复兴的宏伟⽬标继续 前进。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge111", "type": "judge", "n": 111, "q": "邓⼩平发表了《解放思想，实事求是，团结⼀致向前看》的 要讲话，这 实际上是党的⼗⼀届三中全会的主题报告。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge112", "type": "judge", "n": 112, "q": "“⾃⼒更⽣，艰苦创业”不仅是改变我国不发达现状的需要，也体现了社会 主义的奋⽃精神", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge113", "type": "judge", "n": 113, "q": "改⾰不是对原有经济体制细枝末节的修补，它的实质和⽬标是要从根本上 改变束缚我国⽣产⼒发展的经济体制。。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge114", "type": "judge", "n": 114, "q": "改⾰是社会主义社会发展的直接动⼒。。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge115", "type": "judge", "n": 115, "q": "社会主义的本质，是改善⽣产关系，消灭剥削，消除两极分化，最终达到 共同富裕。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge116", "type": "judge", "n": 116, "q": "社会主义精神⽂明是社会主义社会的 要特征。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge117", "type": "judge", "n": 117, "q": "邓⼩平理论指导了中国⾰命的伟⼤实践。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge118", "type": "judge", "n": 118, "q": "邓⼩平提出“四个现代化，关键是科学技术的现代化”。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge119", "type": "judge", "n": 119, "q": "邓⼩平理论形成的时代主题是战争与⾰命。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge120", "type": "judge", "n": 120, "q": "邓⼩平理论⾸要的的基本的理论问题是什么是社会主义，怎样建设社会主 义的问题。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge121", "type": "judge", "n": 121, "q": "两⼿抓，两⼿都要硬。即⼀⼿抓物质⽂明，⼀⼿抓精神⽂明。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge122", "type": "judge", "n": 122, "q": "能否坚持以⽂化建设为中⼼，是关系到我国社会主义现代化成败的⼤问 题。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge123", "type": "judge", "n": 123, "q": "搞清楚什么是社会主义，怎样建设社会主义，关键是在理论层⾯分析⻢克 思主义。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge124", "type": "judge", "n": 124, "q": "是否有利于增强社会主义国家的⽂化软实⼒，是“三个有利于”标准之⼀。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge125", "type": "judge", "n": 125, "q": "根据邓⼩平“三步⾛”发展战略，到21世纪中叶，⼈均国⺠⽣产总值达到⾼ 等发达国家⽔平，全⾯实现现代化。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge126", "type": "judge", "n": 126, "q": "改⾰是中国的第⼆次⾰命。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge127", "type": "judge", "n": 127, "q": "建设中国特⾊社会主义，关键在坚持、加强和改善党的领导。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge128", "type": "judge", "n": 128, "q": "对外开放是建设中国特⾊社会主义的⼀项基本国策。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge129", "type": "judge", "n": 129, "q": "市场经济作为资源配置⼿段本身不具有制度属性，可以和不同的社会制度 结合，从⽽表现出不同的性质。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge130", "type": "judge", "n": 130, "q": "邓⼩平提出⼲部队伍“⾰命化、年轻化、知识化、专业化”的⽅针。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge131", "type": "judge", "n": 131, "q": "社会主义市场经济体制是只运⽤市场调节⼿段的经济体制。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge132", "type": "judge", "n": 132, "q": "在对外开放的过程中，要正确对待资本主义社会创造的现代⽂明成果，同 时也要⾼度珍惜并坚决维护中国⼈⺠经过⻓期奋⽃得来的独⽴⾃主权利。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge133", "type": "judge", "n": 133, "q": "社会主义的根本任务是发展科学技术。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge134", "type": "judge", "n": 134, "q": "我们党建⽴时就是以中国先进⽣产⼒的代表⾛上历史舞台的。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge135", "type": "judge", "n": 135, "q": "办好中国事情的关键在于党。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge136", "type": "judge", "n": 136, "q": "“三个代表” 要思想是中国特⾊社会主义理论体系的 要组成部分。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge137", "type": "judge", "n": 137, "q": "科学技术是第⼀⽣产⼒，是先进⽣产⼒和⽣产关系的集中体现和主要标 志。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge138", "type": "judge", "n": 138, "q": "贯彻“三个代表”要求，关键在保持党的先进性，核⼼在坚持与时俱进，本 质在坚持执政为⺠。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge139", "type": "judge", "n": 139, "q": "发展先进⽣产⼒，是发展先进⽂化、实现最⼴⼤⼈⺠根本利益的决定条 件。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge140", "type": "judge", "n": 140, "q": "“三个代表” 要思想是同⻢克思列宁主义、⽑泽东思想、邓⼩平理论是继 承、丰富、发展的关系。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge141", "type": "judge", "n": 141, "q": "发展中国特⾊社会主义先进⽂化，就是建设社会主义精神⽂明。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge142", "type": "judge", "n": 142, "q": "发展社会主义先进⽂化，必须弘扬以改⾰创新精神为核⼼的⺠族精神。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge143", "type": "judge", "n": 143, "q": "加强社会主义思想道德建设，是发展先进⽂化的 要内容和中⼼环节。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge144", "type": "judge", "n": 144, "q": "“三个代表” 要思想强调社会主义社会是全⾯发展、全⾯进步的社会。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge145", "type": "judge", "n": 145, "q": "全⾯建成⼩康社会是实现现代化建设第⼆步战略⽬标必经的承上启下的发 展阶段。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge146", "type": "judge", "n": 146, "q": "“三个代表” 要思想成功把中国特⾊社会主义推向21世纪。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge147", "type": "judge", "n": 147, "q": "科技进步和创新是发展⽣产⼒的决定因素。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge148", "type": "judge", "n": 148, "q": "坚决反对和防⽌腐败是全党⼀项 ⼤的政治任务，是关系党和国家⽣死存 亡的严 政治⽃争。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge149", "type": "judge", "n": 149, "q": "发展社会主义先进⽂化，就是发展⾯向信息化、⾯向世界、⾯向未来的， ⺠族的科学的⼤众的社会主义⽂化。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge150", "type": "judge", "n": 150, "q": "党的基层组织是党的全部⼯作和战⽃⼒的基础。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge151", "type": "judge", "n": 151, "q": "“三个代表” 要思想强调要努⼒促进⼈的全⾯发展。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge152", "type": "judge", "n": 152, "q": "“三个代表” 要思想是⼀个完整的科学体系。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge153", "type": "judge", "n": 153, "q": "科学发展观是在深刻把握我国基本国情和新的阶段性特征的基础上形成和 发展起来的。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge154", "type": "judge", "n": 154, "q": "进⼊新世纪新阶段，世界发展⼤势、国外发展的经验教训，是科学发展观 形成的协调。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge155", "type": "judge", "n": 155, "q": "以⼈为本是科学发展观的核⼼⽴场，集中体现了⻢克思主义历史唯物论的 基本原理，体现了我们党全⼼全意为⼈⺠服务的根本宗旨和推动经济社会发展 的根本⽬的。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge156", "type": "judge", "n": 156, "q": "全⾯协调可持续中的“全⾯”是指发展要有全⾯性、整体性，不仅经济要发 展，⽽且各⽅⾯都要发展。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge157", "type": "judge", "n": 157, "q": "新形势下，党⾯临着执政考验、改⾰开放考验、市场经济考验、军事实⼒ 的考验。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge158", "type": "judge", "n": 158, "q": "安定有序，就是全社会互帮互助、诚实守信，全体⼈⺠平等友爱、融洽相 处。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge159", "type": "judge", "n": 159, "q": "社会主义核⼼价值体系是根源于⺠族优秀⽂化和⻢克思主义⽂化发展起来 的。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge160", "type": "judge", "n": 160, "q": "发展社会主义⺠主政治，最 要的就是要坚持好、发展好适合我国国情的 社会主义道路。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge161", "type": "judge", "n": 161, "q": "科学发展观强调，全⾯深化经济体制改⾰是加快转变经济发展⽅式的关 键。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge162", "type": "judge", "n": 162, "q": "我们推进发展的根本⽬的就是造福⼈⺠。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge163", "type": "judge", "n": 163, "q": "科学发展观是中国特⾊社会主义理论体系的 要组成部分。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge164", "type": "judge", "n": 164, "q": "我们要彻底改变以牺牲环境、破坏资源为代价的粗放型增⻓⽅式，不能以 牺牲环境为代价去换取⼀时的经济增⻓。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge165", "type": "judge", "n": 165, "q": "科学发展观是全⾯建设⼩康社会、加快推进社会主义现代化的根本指针。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge166", "type": "judge", "n": 166, "q": "“转变经济增⻓⽅式”与“转变经济发展⽅式”虽有⼀词之差，但其内涵是⼀致 的", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge167", "type": "judge", "n": 167, "q": "从党的⼗六⼤到党的⼗⼋⼤，我们党深⼊贯彻落实科学发展观，为全⾯建 成⼩康社会打下了坚实基础。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge168", "type": "judge", "n": 168, "q": "坚 定 不 移 推 进 依 法 治 国 基 本 ⽅ 略 ， 是 国 家 ⻓ 治 久 安 的 要保障", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge169", "type": "judge", "n": 169, "q": "科学发展观同邓⼩平理论、“三个代表” 要思想，⾯对着共同的时代课 题，⾯临着共同的历史任务，都贯穿了中国特⾊社会主义这个主题。", "options": ["正确", "错误"], "answer": "A"}, {"id": "judge170", "type": "judge", "n": 170, "q": "诚信友爱，就是能够使⼀切有利于社会进步的创造愿望得到尊 ，创造活 动得到⽀持，创造才能得到发挥，创造成果得到肯定。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge171", "type": "judge", "n": 171, "q": "选举⺠主是我国社会主义⺠主唯⼀形式。", "options": ["正确", "错误"], "answer": "B"}, {"id": "judge172", "type": "judge", "n": 172, "q": "中国特⾊社会主义共同理想，是社会主义核⼼价值体系的灵魂。", "options": ["正确", "错误"], "answer": "B"}];const KEY='maogai_progress_v1';let db={};try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};let queue=[],pos=0,mode='order',selected=[],done=false,examResults=[];const $=x=>document.getElementById(x);const byId=id=>QUESTIONS.find(x=>x.id===id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));stats()};const letters=['A','B','C','D'];function stats(){let v=Object.values(db),attempts=v.reduce((a,x)=>a+x.attempts,0),correct=v.reduce((a,x)=>a+x.correct,0);$('stats').innerHTML=`<div><b>${v.length}</b><small>已练习题数</small></div><div><b>${v.filter(x=>x.wrong>0).length}</b><small>历史错题</small></div><div><b>${attempts?Math.round(correct/attempts*100):0}%</b><small>作答正确率</small></div>`}function randomize(a){return a.sort(()=>Math.random()-.5)}function start(m){mode=m;let ids=QUESTIONS.map(x=>x.id);if(m==='wrong')ids=ids.filter(id=>db[id]?.wrong>0);if(m==='random'||m==='exam')ids=randomize(ids);if(m==='exam')ids=ids.slice(0,50);queue=ids;pos=0;examResults=[];render()}function updateStartRange(){let t=$('startType').value,list=QUESTIONS.filter(q=>q.type===t),max=list.reduce((m,q)=>Math.max(m,q.n),1),input=$('startNumber');input.max=max;input.placeholder=`1-${max}`}function startFrom(){let t=$('startType').value,n=parseInt($('startNumber').value,10),idx=QUESTIONS.findIndex(q=>q.type===t&&q.n===n),max=QUESTIONS.filter(q=>q.type===t).reduce((m,q)=>Math.max(m,q.n),1);if(!Number.isInteger(n)||idx<0){alert(`请输入有效题号（1-${max}）`);return}mode='order';queue=QUESTIONS.map(q=>q.id);pos=idx;examResults=[];render()}function render(){const root=$('main');if(!queue.length){root.innerHTML='<h2>暂无题目</h2><p>如果你选择了只刷错题，先去顺序刷题积累错题吧。</p>';return}if(pos>=queue.length){root.innerHTML=`<h2>🎉 本轮完成</h2><p>${mode==='exam'?'模拟考试：'+examResults.filter(Boolean).length+' / '+examResults.length+' 题正确':'本轮题目已完成'}</p><button class="primary" onclick="start('${mode}')">再来一轮</button>`;return}let q=byId(queue[pos]);selected=[];done=false;let h=db[q.id]||{attempts:0,wrong:0,correct:0,mastered:false};root.innerHTML=`<div class="row"><span class="tag">${q.type==='single'?'单选':q.type==='multi'?'多选':'判断'} · 原题 ${q.n}</span><span class="tag">${pos+1} / ${queue.length}</span></div><div class="question">${esc(q.q)}</div><div id="options"></div><div id="notice"></div><div class="row" style="margin-top:16px"><button onclick="prev()">上一题</button><span class="muted">累计做错 <strong style="color:#c43e4b;font-size:17px">${h.wrong}</strong> 次 ${h.mastered?'· 已掌握':''}</span><button class="primary" id="action" onclick="submit()">${q.type==='multi'?'确认答案':'提交答案'}</button></div>`;drawOptions()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function drawOptions(){let q=byId(queue[pos]);$('options').innerHTML=q.options.map((o,i)=>{let l=letters[i],cl=selected.includes(l)?'selected':'';if(done){if(q.answer.includes(l))cl='correct';else if(selected.includes(l))cl='wrong'}return `<button class="opt ${cl}" onclick="pick('${l}')" ${done?'disabled':''}>${q.type==='judge'?'':l+'. '}${esc(o)}</button>`}).join('')}function pick(l){if(done)return;let q=byId(queue[pos]);selected=q.type==='multi'?(selected.includes(l)?selected.filter(x=>x!==l):[...selected,l]):[l];drawOptions()}function submit(){if(done){pos++;render();return}if(!selected.length){$('notice').textContent='请先选择答案';return}let q=byId(queue[pos]),correct=selected.slice().sort().join('')===q.answer.split('').sort().join('');let h=db[q.id]||{attempts:0,wrong:0,correct:0,mastered:false};h.attempts++;if(correct){h.correct++;if(h.wrong)h.mastered=true}else{h.wrong++;h.mastered=false}h.last=selected.join('');db[q.id]=h;save();examResults.push(correct);done=true;drawOptions();$('notice').innerHTML=`<p style="color:${correct?'#19865c':'#c43e4b'};font-weight:700">${correct?'✓ 回答正确':'✗ 回答错误'}</p><p>正确答案：${q.answer.split('').join('、')}</p><p class="muted">${h.wrong?'历史累计错误 '+h.wrong+' 次。':''}${h.mastered?' 已标记为掌握，仍保留错题记录。':''}</p>`;$('action').textContent='下一题 →'}function prev(){if(pos>0){pos--;render()}}function showWrong(){let arr=QUESTIONS.filter(q=>db[q.id]?.wrong>0);$('main').innerHTML=`<div class="row"><h2>历史错题本（${arr.length}）</h2><select id="filter" onchange="filterWrong()"><option value="all">全部历史错题</option><option value="open">尚未掌握</option><option value="mastered">已掌握</option></select></div><div class="row"><button onclick="exportData()">导出学习记录</button><button onclick="$('file').click()">导入记录</button><input id="file" type="file" accept="application/json" hidden onchange="importData(event)"></div><div id="wronglist"></div>`;filterWrong()}function filterWrong(){let v=$('filter').value,arr=QUESTIONS.filter(q=>db[q.id]?.wrong>0&&(v==='all'||(v==='mastered'?db[q.id].mastered:!db[q.id].mastered))).sort((a,b)=>db[b.id].wrong-db[a.id].wrong);$('wronglist').innerHTML=arr.length?arr.map(q=>`<div class="history"><b>${q.type==='single'?'单选':q.type==='multi'?'多选':'判断'} ${q.n}.</b> ${esc(q.q)}<div class="muted"><strong style="color:#c43e4b">累计做错 ${db[q.id].wrong} 次</strong> · ${db[q.id].mastered?'已掌握':'尚未掌握'}</div><button onclick="review('${q.id}')">重新做这题</button></div>`).join(''):'<p class="muted">当前筛选下没有错题。</p>'}function review(id){mode='wrong';queue=[id];pos=0;render()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='毛概刷题记录.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let o=JSON.parse(t);if(!o||typeof o!=='object'||Array.isArray(o))throw Error();db=o;save();showWrong()}catch(e){alert('文件格式不正确')}})}stats();updateStartRange();start('order');</script></html>
